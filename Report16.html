<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
    <style>
        .container {
            display: flex;
            gap: 30px;
        }
        .box {
            border: 2px solid red;
            padding: 15px;
            width: 180px;
        }
    </style>
</head>
<body>


<div class="container">


    <div class="box">
        <ol type="1">
            <li>Coffee</li>
            <li>Tea</li>
            <li>Milk</li>
        </ol>
        <ol type="i">
            <li>Coffee</li>
            <li>Tea</li>
            <li>Milk</li>
        </ol>
    </div>
 

    <div class="box">
        <ul>
            <li>Apples</li>
            <li>Bananas</li>
            <li>Lemons</li>
            <li>Oranges</li>
        </ul>
    </div>

    <div class="box">
        <dl>
            <dt>Coffee</dt>
            <dd>- A black hot drink</dd>

            <dt>Milk</dt>
            <dd>- A white cold drink</dd>
        </dl>
    </div>

</div>

</body>
</html>
