<!DOCTYPE html>
<html>
<head>
<title>Car Animation</title>

<style>
body{
    text-align:center;
}

#road{
    width:100%;
    height:10px;
    background:brown;
    position:relative;
    margin-top:150px;
}

#car{
    width:120px;
    position:absolute;
    top:-70px;
    left:0;
}

button{
    margin:20px;
    padding:10px 20px;
}
</style>
</head>

<body>

<div id="road">
<img src="Car.jpg" id="car">
</div>

<br>

<button onclick="startCar()">Start</button>
<button onclick="stopCar()">Stop</button>
<button onclick="reverseCar()">Reverse</button>

<script>

let car = document.getElementById("car");
let pos = 0;
let move;

function startCar(){
    clearInterval(move);
    move = setInterval(function(){
        pos += 5;
        car.style.left = pos + "px";
    },50);
}

function stopCar(){
    clearInterval(move);
}

function reverseCar(){
    clearInterval(move);
    move = setInterval(function(){
        pos -= 5;
        car.style.left = pos + "px";
    },50);
}

</script>

</body>
</html>
