<!DOCTYPE html>
<html>
<head>
  <title>Stopwatch</title>
  <style>
    body{
      text-align: center;
      margin-top: 100px;
    }
    #time{
      font-size: 40px;
      margin-bottom: 20px;
    }
    button{
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h1>Stopwatch</h1>
<div id="time">00:00:00</div>

<button onclick="start()">Start</button>
<button onclick="pause()">Pause</button>
<button onclick="reset()">Reset</button>

<script>
let seconds = 0;
let minutes = 0;
let hours = 0;
let timer = null;

function updateDisplay(){
  let h = String(hours).padStart(2,'0');
  let m = String(minutes).padStart(2,'0');
  let s = String(seconds).padStart(2,'0');

  document.getElementById("time").innerText = h + ":" + m + ":" + s;
}

function stopwatch(){
  seconds++;

  if(seconds == 60){
    seconds = 0;
    minutes++;
  }

  if(minutes == 60){
    minutes = 0;
    hours++;
  }

  updateDisplay();
}

function start(){
  if(timer !== null) return;
  timer = setInterval(stopwatch,1000);
}

function pause(){
  clearInterval(timer);
  timer = null;
}

function reset(){
  clearInterval(timer);
  timer = null;
  seconds = 0;
  minutes = 0;
  hours = 0;
  updateDisplay();
}
</script>

</body>
</html>
