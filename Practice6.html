<!DOCTYPE html>
<html>

<head>
    <title>SumEven</title>
</head>

<body>
    <input type="text" id="numbers" placeholder="1,2,3,4">
    <button onclick="sumEven()">Calculate</button>
    <p id="result"></p>

    <script>
        function sumEven() {
          arr = (document.getElementById("numbers").value).split(",");
            sum = 0;

            for ( i = 0; i < arr.length; i++) {
                const val = parseInt(arr[i])
                if (val % 2 === 0) {
                    sum += val;
                }
            }

            document.getElementById("result").innerText = "Sum: " + sum;
        }
    </script>

</body>

</html>
