<!DOCTYPE html>
<html>

<head>
    
    <title>Responsive Layout 2</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            display: grid;
            grid-template-areas:
                "header header header"
                "nav nav nav"
                "sidebar main main"
                "ads footer footer";
            grid-template-columns: 200px 1fr 1fr;
            grid-gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 500px;
        }

        .item {
            border: 1px solid #ff9999;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
            background-color: #fff;
            box-sizing: border-box;
        }

        .header {
            grid-area: header;
            height: 60px;
        }

        .nav {
            grid-area: nav;
            height: 40px;
        }

        .sidebar {
            grid-area: sidebar;
            height: 300px;
        }

        .main {
            grid-area: main;
            height: 300px;

        }

        .ads {
            grid-area: ads;
            height: 60px;
        }

        .footer {
            grid-area: footer;
            height: 60px;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-areas:
                    "header"
                    "nav"
                    "main"
                    "sidebar"
                    "ads"
                    "footer";
                grid-template-columns: 1fr;
            }

            .sidebar,
            .main,
            .ads,
            .footer {
                height: auto;
                min-height: 50px;
            }
        }
    </style>
</head>

<body>

    <h2 style="text-align: center;">Responsive Layout using CSS Grid</h2>

    <div class="container">
        <div class="item header">Header</div>

        <div class="item nav">Navigation</div>

        <div class="item sidebar">Sidebar</div>

        <div class="item main">Main</div>

        <div class="item ads">ads</div>

        <div class="item footer">Footer</div>
    </div>

</body>

</html>
