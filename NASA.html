<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System - Works Guaranteed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000;
            font-family: Arial, sans-serif;
        }
        canvas { display: block; }
        
        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(15,25,45,0.95);
            padding: 20px;
            border-radius: 12px;
            color: #fff;
            border: 1px solid rgba(100,150,255,0.3);
            z-index: 100;
            min-width: 220px;
        }
        
        #ui h2 {
            margin: 0 0 15px 0;
            font-size: 15px;
            color: #4db8ff;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(100,150,255,0.2);
            padding-bottom: 12px;
        }
        
        .control {
            margin: 12px 0;
            font-size: 12px;
        }
        
        .control label {
            display: flex;
            justify-content: space-between;
            color: #889;
            margin-bottom: 6px;
        }
        
        .control input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(100,150,255,0.2);
            border-radius: 2px;
            appearance: none;
            cursor: pointer;
        }
        .control input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            background: #4db8ff;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .info {
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid rgba(100,150,255,0.15);
            font-size: 11px;
            color: #667;
            line-height: 1.8;
        }
        
        .info b { color: #4db8ff; }
    </style>
</head>
<body>

<div id="ui">
    <h2>🌌 Solar System 3D</h2>
    <div class="control">
        <label>Orbit Speed <span id="speedVal">1.0x</span></label>
        <input type="range" id="speed" min="0" max="3" step="0.1" value="1">
    </div>
    <div class="control">
        <label>Zoom <span id="zoomVal">1.0x</span></label>
        <input type="range" id="zoom" min="0.5" max="2" step="0.1" value="1">
    </div>
    <div class="info">
        <b>🖱️ Drag</b> - Move view<br>
        <b>🔍 Scroll</b> - Zoom<br>
        <b>🌍 Earth</b> - 3rd planet (blue)<br>
        <b>🌑 Moon</b> - Orbits Earth<br>
        <b>🪐 Saturn</b> - Has rings
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height, centerX, centerY;
let offsetX = 0, offsetY = 0;
let zoom = 1;
let speed = 1;
let isDragging = false;
let lastX, lastY;
let rotation = 0;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    centerX = width / 2;
    centerY = height / 2;
}
resize();
window.addEventListener('resize', resize);

// Stars
const stars = [];
for (let i = 0; i < 1000; i++) {
    stars.push({
        x: Math.random() * 4000 - 2000,
        y: Math.random() * 4000 - 2000,
        z: Math.random() * 2000 - 1000,
        size: Math.random() * 2 + 0.5
    });
}

// Planets
const planets = [
    { name: "Mercury", distance: 40, size: 3, speed: 0.04, color: "#8c8c8c", angle: Math.random() * 6 },
    { name: "Venus", distance: 60, size: 5, speed: 0.015, color: "#e6c87a", angle: Math.random() * 6 },
    { name: "Earth", distance: 85, size: 5.5, speed: 0.01, color: "#4a90d9", angle: Math.random() * 6, hasMoon: true },
    { name: "Mars", distance: 110, size: 4, speed: 0.008, color: "#c1440e", angle: Math.random() * 6 },
    { name: "Jupiter", distance: 145, size: 12, speed: 0.004, color: "#d8ca9d", angle: Math.random() * 6 },
    { name: "Saturn", distance: 185, size: 10, speed: 0.003, color: "#f4d59e", angle: Math.random() * 6, hasRing: true },
    { name: "Uranus", distance: 220, size: 7, speed: 0.002, color: "#88ddff", angle: Math.random() * 6 },
    { name: "Neptune", distance: 250, size: 7, speed: 0.001, color: "#5b5ddf", angle: Math.random() * 6 }
];

const moon = { distance: 12, size: 1.5, speed: 0.08, angle: 0, color: "#aaaaaa" };

// Draw 3D sphere with shading
function drawSphere(x, y, radius, color, lightX, lightY) {
    // Base color
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    
    // 3D shading gradient
    const grad = ctx.createRadialGradient(
        x - radius * 0.3, y - radius * 0.3, 0,
        x, y, radius
    );
    grad.addColorStop(0, 'rgba(255,255,255,0.3)');
    grad.addColorStop(0.3, 'rgba(255,255,255,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.4)');
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    
    // Shadow (dark side)
    const angleToLight = Math.atan2(y - lightY, x - lightX);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angleToLight);
    
    const shadowGrad = ctx.createLinearGradient(-radius, 0, radius, 0);
    shadowGrad.addColorStop(0, 'rgba(0,0,0,0)');
    shadowGrad.addColorStop(0.5, 'rgba(0,0,0,0)');
    shadowGrad.addColorStop(0.6, 'rgba(0,0,0,0.3)');
    shadowGrad.addColorStop(1, 'rgba(0,0,0,0.7)');
    
    ctx.fillStyle = shadowGrad;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

// Draw stars with parallax
function drawStars() {
    stars.forEach(star => {
        const parallaxX = star.x + offsetX * (star.z / 2000);
        const parallaxY = star.y + offsetY * (star.z / 2000);
        const twinkle = Math.sin(Date.now() * 0.003 + star.z) * 0.3 + 0.7;
        
        ctx.fillStyle = `rgba(255, 255, 255, ${twinkle})`;
        ctx.beginPath();
        ctx.arc(parallaxX, parallaxY, star.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

// Draw Sun with glow
function drawSun() {
    const x = centerX + offsetX;
    const y = centerY + offsetY;
    const radius = 25 * zoom;
    
    // Glow layers
    for (let i = 4; i > 0; i--) {
        const grad = ctx.createRadialGradient(x, y, radius * 0.5, x, y, radius * i);
        grad.addColorStop(0, `rgba(255, 200, 50, ${0.4 / i})`);
        grad.addColorStop(0.5, `rgba(255, 150, 0, ${0.3 / i})`);
        grad.addColorStop(1, 'rgba(255, 100, 0, 0)');
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, radius * i, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Sun body
    const sunGrad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, 0, x, y, radius);
    sunGrad.addColorStop(0, '#ffffff');
    sunGrad.addColorStop(0.2, '#fff5cc');
    sunGrad.addColorStop(0.5, '#ffdd44');
    sunGrad.addColorStop(1, '#ff8800');
    
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
}

// Draw planet with orbit
function drawPlanet(planet, isMoon = false, parentX = 0, parentY = 0) {
    let x, y;
    
    if (isMoon) {
        x = parentX + Math.cos(planet.angle) * planet.distance * zoom;
        y = parentY + Math.sin(planet.angle) * planet.distance * zoom;
    } else {
        x = centerX + offsetX + Math.cos(planet.angle) * planet.distance * zoom;
        y = centerY + offsetY + Math.sin(planet.angle) * planet.distance * zoom;
    }
    
    const radius = planet.size * zoom;
    
    // Draw orbit path
    if (!isMoon) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(centerX + offsetX, centerY + offsetY, planet.distance * zoom, 0, Math.PI * 2);
        ctx.stroke();
    }
    
    // Draw planet sphere
    drawSphere(x, y, radius, planet.color, centerX + offsetX, centerY + offsetY);
    
    // Saturn's rings
    if (planet.hasRing && !isMoon) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(planet.angle + Math.PI / 4);
        
        ctx.strokeStyle = 'rgba(200, 180, 140, 0.6)';
        ctx.lineWidth = radius * 0.5;
        ctx.beginPath();
        ctx.ellipse(0, 0, radius * 2.2, radius * 0.7, 0, 0, Math.PI * 2);
        ctx.stroke();
        
        ctx.strokeStyle = 'rgba(180, 160, 120, 0.5)';
        ctx.lineWidth = radius * 0.3;
        ctx.beginPath();
        ctx.ellipse(0, 0, radius * 1.7, radius * 0.55, 0, 0, Math.PI * 2);
        ctx.stroke();
        
        ctx.restore();
    }
    
    // Moon for Earth
    if (planet.hasMoon && !isMoon) {
        moon.angle += moon.speed * speed;
        drawPlanet(moon, true, x, y);
    }
}

// Main animation
function animate() {
    // Clear
    ctx.fillStyle = '#000008';
    ctx.fillRect(0, 0, width, height);
    
    // Stars
    drawStars();
    
    // Sun
    drawSun();
    
    // Planets
    planets.forEach(planet => {
        planet.angle += planet.speed * speed;
        drawPlanet(planet);
    });
    
    requestAnimationFrame(animate);
}

// Controls
document.getElementById('speed').addEventListener('input', (e) => {
    speed = parseFloat(e.target.value);
    document.getElementById('speedVal').textContent = speed.toFixed(1) + 'x';
});

document.getElementById('zoom').addEventListener('input', (e) => {
    zoom = parseFloat(e.target.value);
    document.getElementById('zoomVal').textContent = zoom.toFixed(1) + 'x';
});

// Mouse drag
canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
});

canvas.addEventListener('mousemove', (e) => {
    if (isDragging) {
        offsetX += e.clientX - lastX;
        offsetY += e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
    }
});

canvas.addEventListener('mouseup', () => { isDragging = false; });
canvas.addEventListener('mouseleave', () => { isDragging = false; });

// Scroll zoom
canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoom += e.deltaY * -0.001;
    zoom = Math.max(0.5, Math.min(10, zoom));
    document.getElementById('zoom').value = zoom;
    document.getElementById('zoomVal').textContent = zoom.toFixed(1) + 'x';
});

// Start
console.log("✅ Solar System Started!");
animate();
</script>

</body>
</html>
