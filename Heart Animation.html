<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hearts Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0f0 100%);
        }
        canvas {
            display: block;
        }
        #text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Arial', sans-serif;
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="text">You Are Looking So Beautiful, Man❤️</div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffe0f0);
        
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 50;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        function createHeartShape() {
            const x = 0, y = 0;
            const heartShape = new THREE.Shape();
            
            for (let i = 0; i < Math.PI * 2; i += 0.01) {
                const hx = 16 * Math.pow(Math.sin(i), 3);
                const hy = -(13 * Math.cos(i) - 5 * Math.cos(2*i) - 2 * Math.cos(3*i) - Math.cos(4*i));
                
                if (i === 0) {
                    heartShape.moveTo(x + hx * 0.5, y + hy * 0.5);
                } else {
                    heartShape.lineTo(x + hx * 0.5, y + hy * 0.5);
                }
            }
            heartShape.closePath();
            return heartShape;
        }

        const hearts = [];
        const heartGeometry = new THREE.ExtrudeGeometry(createHeartShape(), {
            depth: 2,
            bevelEnabled: true,
            bevelSegments: 2,
            steps: 2,
            bevelSize: 1,
            bevelThickness: 1
        });

        const colors = [0xff0040, 0xff4080, 0xff80b0, 0xc040a0, 0xff2060, 0xff6090];
        
        for (let i = 0; i < 150; i++) {
            const material = new THREE.MeshPhongMaterial({
                color: colors[Math.floor(Math.random() * colors.length)],
                shininess: 100,
                transparent: true,
                opacity: 0.8
            });

            const heart = new THREE.Mesh(heartGeometry, material);
            
            heart.position.x = (Math.random() - 0.5) * 100;
            heart.position.y = (Math.random() - 0.5) * 100;
            heart.position.z = (Math.random() - 0.5) * 50 - 10;
            
            heart.rotation.x = Math.random() * Math.PI;
            heart.rotation.y = Math.random() * Math.PI;
            
            const scale = Math.random() * 0.5 + 0.3;
            heart.scale.set(scale, scale, scale);
            
            heart.userData = {
                speedY: Math.random() * 0.05 + 0.02,
                speedX: Math.random() * 0.02 - 0.01,
                rotationSpeed: Math.random() * 0.02 - 0.01,
                originalY: heart.position.y
            };
            
            scene.add(heart);
            hearts.push(heart);
        }

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xffffff, 1);
        pointLight1.position.set(10, 10, 10);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff69b4, 0.8);
        pointLight2.position.set(-10, -10, 10);
        scene.add(pointLight2);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(0, 10, 5);
        scene.add(directionalLight);

        function animate() {
            requestAnimationFrame(animate);

            hearts.forEach(heart => {

                heart.position.y += heart.userData.speedY;
                heart.position.x += Math.sin(heart.position.y * 0.1) * 0.02;
                
                heart.rotation.x += heart.userData.rotationSpeed;
                heart.rotation.z += heart.userData.rotationSpeed * 0.5;
                
                if (heart.position.y > 50) {
                    heart.position.y = -50;
                    heart.position.x = (Math.random() - 0.5) * 100;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
