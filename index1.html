<!DOCTYPE html>
<html>
<head>
    <title>The map and area elements</title>
</head>
<body>

<h2>The map and area elements</h2>
<p>Click on the computer, the phone, or the cup of coffee to go to a new page and read more about the topic:</p>

<img src="desk.jpg" alt="Desk setup" usemap="#deskmap" width="500">

<map name="deskmap">
    <!-- Computer area -->
    <area shape="rect" coords="60,40,320,230"
          href="computer.html"
          alt="Computer">

    <!-- Phone area -->
    <area shape="rect" coords="350,120,430,250"
          href="phone.html"
          alt="Phone">

    <!-- Coffee area -->
    <area shape="circle" coords="250,300,40"
          href="coffee.html"
          alt="Coffee">
</map>

</body>
</html>
