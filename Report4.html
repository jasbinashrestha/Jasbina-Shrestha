<!DOCTYPE html>
<html>
<head>
    <title>Audio and Video</title>
</head>
<body>

<h2>Audio Example</h2>
<audio controls>
    <source src="Song.mp4" allow="autoplay" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<br><br>

<h2>Video Example</h2>
<video width="250" height="400" controls>
    <source src="Video.mp4" allow="autoplay" type="video/mp4">
    Your browser does not support the video element.
</video>

</body>
</html>
