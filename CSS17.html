<!DOCTYPE html>
<html>

<head>

    <title>Responsive Layout 3</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            display: grid;
            grid-template-areas:
                "header header header"
                "nav nav nav"
                "main main main"
                "sidebar sidebar sidebar"
                "ads ads ads"
                "footer footer footer";
            grid-template-columns: 1fr;
            grid-gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #ddd;
            padding: 20px;
            min-height: 500px;
        }

        .item {
            border: 1px solid #ff9999;
            padding: 20px;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-weight: bold;
            color: #333;
            background-color: #fff;
            box-sizing: border-box;
        }

        .header {
            grid-area: header;
            height: 50px;
        }

        .nav {
            grid-area: nav;
            height: 40px;
        }

        .main {
            grid-area: main;
            height: 300px;
        }

        .sidebar {
            grid-area: sidebar;
            height: 50px;
        }

        .ads {
            grid-area: ads;
            height: 50px;
        }

        .footer {
            grid-area: footer;
            height: 50px;
        }

        @media (min-width: 600px) {
            
        }
    </style>
</head>

<body>

    <h2 style="text-align: center;">Responsive Layout using CSS Grid</h2>

    <div class="container">
        <div class="item header">Header</div>

        <div class="item nav">Navigation</div>

        <div class="item main">Main</div>

        <div class="item sidebar">Sidebar</div>

        <div class="item ads">ads</div>

        <div class="item footer">Footer</div>
    </div>

</body>

</html>
