<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model Visualization</title>
    <style>
        body {
            margin: 0;
            background: #d9dccb;
        }

        .frame {
            width: 420px;

            margin: 30px auto;
            background: #eeeeee;
            border: 3px solid #c96b5c;
            padding: 20px;
            box-sizing: border-box;
        }


        h1 {
            text-align: center;
            margin: 0 0 15px 0;
            font-size: 20px;

            color: #2c3e50;
        }

        .legend {
            text-align: center;
            margin-bottom: 20px;
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            margin: 0 6px;
            font-size: 12px;
            color: #444;
        }

        .legend span::before {
            content: "";
            width: 12px;
            height: 12px;
            margin-right: 5px;
            border-radius: 3px;
            display: inline-block;
        }


        .margin-color::before {
            background: #e74c3c;
        }

        .border-color::before {
            background: #f39c12;
        }

        .padding-color::before {
            background: #2e86c1;
        }

        .content-color::before {
            background: #5cb85c;
        }

        .margin {
            background: #e74c3c;
            padding: 18px;
            border-radius: 8px;
        }

        .border {
            background: #f39c12;
            padding: 18px;
            border-radius: 6px;
        }

        .padding {
            background: #2e86c1;
            padding: 18px;
            border-radius: 5px;
        }

        .content {
            background: #5cb85c;
            padding: 25px;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
            color: white;
        }


        .label {
            color: white;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
        }
    </style>
</head>

<body>

    <div class="frame">

        <h1>CSS Box Model Visualization</h1>

        <div class="legend">
            <span class="margin-color">Margin</span>
            <span class="border-color">Border</span>
            <span class="padding-color">Padding</span>
            <span class="content-color">Content</span>
        </div>

        <div class="margin">
            <div class="label">Margin</div>

            <div class="border">
                <div class="label">Border</div>

                <div class="padding">
                    <div class="label">Padding</div>

                    <div class="content">
                        Content
                    </div>
                </div>

            </div>
        </div>

    </div>

</body>

</html>
