<!DOCTYPE html>
<html>
<head>
</head>
<body>
<input type="text" id="numbers" placeholder="1,2,3,4">
<button onclick="Largest()">Find</button>
<p id="result"></p>

<script>
function Largest() {
     arr = document.getElementById("numbers").value;
     largest = arr[0];
    for ( i = 1; i < arr.length; i++) {
        if (arr[i] > largest) largest = arr[i];
    }
    document.getElementById("result").innerText = "Largest: " + largest;
}
</script>

</body>
</html>
