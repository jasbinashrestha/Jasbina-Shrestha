<!DOCTYPE html>
<html>
<head>
    <title>Reverse</title>
</head>
<body>
<input type="text" id="text">
<button onclick="reverseText()">Reverse</button>
<p id="result"></p>

<script>
function reverseText() {
   str = document.getElementById("text").value;
   reversed = " ";
    for (let i = str.length - 1; i >= 0; i--) {
        reversed += str[i];
    }
    document.getElementById("result").innerText = reversed;
}
</script>

</body>
</html>
