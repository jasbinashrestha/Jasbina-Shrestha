<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin:0; background:black; }
    canvas { display:block; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const particles = [];

for (let i = 0; i < 5000; i++) {
  const angle1 = Math.random() * Math.PI * 2;
  const angle2 = Math.random() * Math.PI;
  const r = 200;

  particles.push({
    x: r * Math.sin(angle2) * Math.cos(angle1),
    y: r * Math.sin(angle2) * Math.sin(angle1),
    z: r * Math.cos(angle2)
  });
}

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p => {
    const scale = 400 / (400 + p.z);
    const x = p.x * scale + canvas.width/2;
    const y = p.y * scale + canvas.height/2;

    ctx.fillStyle = "white";
    ctx.fillRect(x, y, 1, 1);

    const x0 = p.x;
    p.x = p.x * Math.cos(0.002) - p.z * Math.sin(0.002);
    p.z = x0 * Math.sin(0.002) + p.z * Math.cos(0.002);
  });

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
