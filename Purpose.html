<!DOCTYPE html>
<html>
<head>
<title>My Proposal ❤️</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
    position:relative;
}

.container img{
    width:220px;
}

h1{
    color:white;
    font-size:34px;
}

p{
    color:white;
    font-size:18px;
}

button{
    padding:12px 28px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin:10px;
    transition:0.3s;
}

#yesBtn{
    background:#ff4d6d;
    color:white;
}

#yesBtn:hover{
    transform:scale(1.1);
}

#noBtn{
    background:#444;
    color:white;
    position:absolute;
}

/* floating hearts */

.heart{
    position:absolute;
    color:red;
    font-size:20px;
    animation:float 6s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(0);
        opacity:1;
    }
    100%{
        transform:translateY(-100vh);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="container">

<img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">

<h1>Will you be my Boyfriend? ❤️</h1>

<p>You make my world brighter every day.</p>

<button id="yesBtn" onclick="yesClicked()">Yes 💖</button>
<button id="noBtn">No 😢</button>

</div>

<script>

const noBtn = document.getElementById("noBtn");
const container = document.querySelector(".container");

const messages = [
"Are you sure? 😢",
"Please don't say no 🥺",
"Think again ❤️",
"You can't escape 😆",
"Just press YES already!"
];

let msgIndex = 0;

noBtn.addEventListener("mouseover", () => {

    const box = container.getBoundingClientRect();

    const maxX = box.width - 100;
    const maxY = box.height - 50;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";

    noBtn.innerText = messages[msgIndex];
    msgIndex = (msgIndex + 1) % messages.length;

});

function yesClicked(){

document.body.innerHTML = `

<style>

.lovePage{
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
height:100vh;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

.message{
font-size:20px;
max-width:600px;
line-height:1.6;
margin-top:20px;
}

</style>

<div class="lovePage">

<h1>Yay!! ❤️</h1>

<h2>You just made me the happiest person alive! 🥰</h2>

<img src="https://media.giphy.com/media/3oz8xIsloV7zOmt81G/giphy.gif" width="250">

<div class="message">
Thank you for saying <b>YES</b> ❤️ <br><br>

From the moment I met you, my world became brighter.  
Your smile makes my day better, your voice makes my heart calm,  
and your presence makes everything feel perfect.  

Today is the beginning of something beautiful.  
I promise to always care for you, support you,  
and make you smile every single day.  

Let's create amazing memories together.  
This is just the start of our love story. 💕
</div>

<h2 style="margin-top:30px;">I Love You ❤️</h2>

</div>

`;

startHearts();

}

/* floating hearts */

function startHearts(){

setInterval(()=>{
const heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=Math.random()*25+15+"px";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);

},300);

}

</script>

</body>
</html>
