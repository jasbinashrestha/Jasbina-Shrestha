<!DOCTYPE html>
<html>
<head>
    <title>My Proposal ❤️</title>
<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
    position:relative;
}

.container img{
    width:220px;
}

h1{
    color:white;
    font-size:32px;
}

p{
    color:white;
    font-size:18px;
}

button{
    padding:12px 28px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin:10px;
}

#yesBtn{
    background:#ff4d6d;
    color:white;
}

#noBtn{
    background:#444;
    color:white;
    position:absolute;
}

</style>
</head>

<body>

<div class="container">

<img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">

<h1>Will you be my Boyfriend? ❤️</h1>

<p>You make my world brighter every day.</p>

<button id="yesBtn" onclick="yesClicked()">Yes 💖</button>
<button id="noBtn">No 😢</button>

</div>

<script>

const noBtn = document.getElementById("noBtn");
const container = document.querySelector(".container");

noBtn.addEventListener("mouseover", () => {

    const box = container.getBoundingClientRect();

    const maxX = box.width - 100;
    const maxY = box.height - 50;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";

});

function yesClicked(){
    document.body.innerHTML = `
        <div style="display:flex;
                    justify-content:center;
                    align-items:center;
                    height:100vh;
                    flex-direction:column;
                    background:#ff758c;
                    font-family:Arial;
                    color:white;
                    text-align:center;">
        <h1>Yay!! ❤️</h1>
        <h2>You just made me the happiest person alive!</h2>
        <img src="https://media.giphy.com/media/3oz8xIsloV7zOmt81G/giphy.gif" width="250">
        </div>
    `;
}

</script>

</body>
</html>
