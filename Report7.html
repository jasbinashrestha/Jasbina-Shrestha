<!DOCTYPE html>
<html>

<head>
    <title>Iframe Example</title>
</head>

<body>

    <h2>Embedding YouTube Video using iframe</h2>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/wV2Q8VNr1uc?autoplay=1" allow="autoplay"></iframe>


    <hr>

    <h2>Google Map: Bhaktapur Multiple Campus</h2>

    <iframe src="https://www.google.com/maps?q=Bhaktapur+Multiple+Campus&output=embed" width="600" height="450"
        style="border:0;" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
    </iframe>

    <hr>

    <h2>Google Map: My Own Location Choice</h2>
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3532.780721977889!2d85.28114339999999!3d27.6931714!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39eb187a97f390b1%3A0xec3f47092df0d4ca!2sKalanki%2C%20Kathmandu%2044600!5e0!3m2!1sen!2snp!4v1770908942434!5m2!1sen!2snp"
        width="600" height="450" style="border:0;" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
    </iframe>

</body>

</html>
